# Builds the Android APK and publishes it as a GitHub Release.
#
# Release: bump `version:` in pubspec.yaml, commit, then push a matching tag:
#   git tag v1.0.1; git push origin main v1.0.1
# The APK is signed with the permanent release key from the repo secrets
# EASYDRAW_KEYSTORE_BASE64 and EASYDRAW_KEY_PASSWORD (set them with
# tools/create_release_key.ps1), so it installs over earlier releases.
#
# Manual run (Actions tab -> Release -> Run workflow): builds a check APK
# signed with a throwaway debug key, keeps it as a workflow artifact and
# publishes nothing. Useful to confirm the build still works in CI.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the pubspec version
        if: github.event_name == 'push'
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//; s/[[:space:]]+$//')
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $v (expected v$v)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore the release key
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.EASYDRAW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret EASYDRAW_KEYSTORE_BASE64 is missing. Run tools/create_release_key.ps1 first."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "EASYDRAW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "EASYDRAW_REQUIRE_RELEASE_KEY=true" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          EASYDRAW_KEY_PASSWORD: ${{ secrets.EASYDRAW_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="easy-draw-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "Easy Draw ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Keep the check APK
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: easy-draw-check-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
